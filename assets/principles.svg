<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Navigation principles: human-centered design, intuitive journeys, clean code, performance, clear signal">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050f"/>
      <stop offset="55%" stop-color="#0a0922"/>
      <stop offset="100%" stop-color="#170e33"/>
    </linearGradient>
    <radialGradient id="nP" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7b4dff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nP2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#31d0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardP"><rect width="1000" height="250" rx="20"/></clipPath>
    <style>
      .tw{animation:tw 3.4s ease-in-out infinite}
      .a1{animation-delay:.4s}.a2{animation-delay:.9s}.a3{animation-delay:1.4s}.a4{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .link{stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .node{animation:bob 6s ease-in-out infinite}
      .n1{animation-delay:.6s}.n2{animation-delay:1.2s}.n3{animation-delay:1.8s}.n4{animation-delay:2.4s}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .halo{animation:halo 4s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.25}50%{opacity:.7}}
      .comet{offset-path:path('M 60 96 Q 300 40 500 96 T 940 96');animation:comet 9s linear infinite}
      @keyframes comet{from{offset-distance:0%}to{offset-distance:100%}}
    </style>
  </defs>

  <g clip-path="url(#cardP)">
    <rect width="1000" height="250" fill="url(#bgP)"/>
    <ellipse cx="180" cy="20" rx="320" ry="140" fill="url(#nP)"/>
    <ellipse cx="880" cy="240" rx="300" ry="140" fill="url(#nP2)"/>
    <rect x="0" y="0" width="1000" height="250" rx="20" fill="none" stroke="#8fd8ff" stroke-opacity=".18"/>

    <g fill="#fff">
      <circle class="tw"    cx="52"  cy="36"  r="1.2"/><circle class="tw a2" cx="212" cy="28"  r="1"/>
      <circle class="tw a1" cx="420" cy="40"  r="1.4"/><circle class="tw a3" cx="640" cy="26"  r="1"/>
      <circle class="tw a4" cx="860" cy="44"  r="1.3"/><circle class="tw a2" cx="960" cy="30"  r="1"/>
      <circle class="tw a3" cx="120" cy="228" r="1.2"/><circle class="tw"    cx="500" cy="236" r="1"/>
      <circle class="tw a1" cx="800" cy="230" r="1.3"/><circle class="tw a4" cx="300" cy="222" r="1"/>
    </g>

    <path class="link" d="M 100 96 Q 300 42 500 96 T 900 96" fill="none" stroke="#8fd8ff" stroke-opacity=".38" stroke-width="1.4"/>
    <circle class="comet" r="3.2" fill="#ffd97a"/>

    <g class="node">
      <circle cx="100" cy="96" r="30" fill="#8fd8ff" fill-opacity=".10" class="halo"/>
      <circle cx="100" cy="96" r="21" fill="#0d0c24" stroke="#8fd8ff" stroke-opacity=".55"/>
      <circle cx="100" cy="96" r="7" fill="none" stroke="#8fd8ff" stroke-width="1.6"/>
      <ellipse cx="100" cy="96" rx="13" ry="5" fill="none" stroke="#8fd8ff" stroke-width="1.4" transform="rotate(-20 100 96)"/>
    </g>
    <g class="node n1">
      <circle cx="300" cy="96" r="30" fill="#b39bff" fill-opacity=".10" class="halo"/>
      <circle cx="300" cy="96" r="21" fill="#0d0c24" stroke="#b39bff" stroke-opacity=".55"/>
      <path d="M290 104 q10 -18 20 -16" fill="none" stroke="#c3b0ff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="290" cy="104" r="2.6" fill="#c3b0ff"/><circle cx="310" cy="88" r="2.6" fill="#c3b0ff"/>
    </g>
    <g class="node n2">
      <circle cx="500" cy="96" r="30" fill="#7ee7c7" fill-opacity=".10" class="halo"/>
      <circle cx="500" cy="96" r="21" fill="#0d0c24" stroke="#7ee7c7" stroke-opacity=".55"/>
      <path d="M494 88 l-7 8 7 8 M506 88 l7 8 -7 8" fill="none" stroke="#7ee7c7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="node n3">
      <circle cx="700" cy="96" r="30" fill="#ffd97a" fill-opacity=".10" class="halo"/>
      <circle cx="700" cy="96" r="21" fill="#0d0c24" stroke="#ffd97a" stroke-opacity=".55"/>
      <path d="M692 102 l6 -8 5 5 7 -10" fill="none" stroke="#ffd97a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="node n4">
      <circle cx="900" cy="96" r="30" fill="#ff9ec7" fill-opacity=".10" class="halo"/>
      <circle cx="900" cy="96" r="21" fill="#0d0c24" stroke="#ff9ec7" stroke-opacity=".55"/>
      <circle cx="900" cy="99" r="2.6" fill="#ff9ec7"/>
      <path d="M894 94 a8 8 0 0 1 12 0" fill="none" stroke="#ff9ec7" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M889 88 a15 15 0 0 1 22 0" fill="none" stroke="#ff9ec7" stroke-width="1.5" stroke-opacity=".7" stroke-linecap="round"/>
    </g>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
      <text x="100" y="158" font-size="14" font-weight="700" fill="#ffffff">Human-centered</text>
      <text x="100" y="180" font-size="11.5" fill="#9c96c4">the person comes</text>
      <text x="100" y="196" font-size="11.5" fill="#9c96c4">before the pattern</text>

      <text x="300" y="158" font-size="14" font-weight="700" fill="#ffffff">Intuitive journeys</text>
      <text x="300" y="180" font-size="11.5" fill="#9c96c4">no one should need</text>
      <text x="300" y="196" font-size="11.5" fill="#9c96c4">a map to find the way</text>

      <text x="500" y="158" font-size="14" font-weight="700" fill="#ffffff">Clean code</text>
      <text x="500" y="180" font-size="11.5" fill="#9c96c4">future me is</text>
      <text x="500" y="196" font-size="11.5" fill="#9c96c4">also a user</text>

      <text x="700" y="158" font-size="14" font-weight="700" fill="#ffffff">Performance</text>
      <text x="700" y="180" font-size="11.5" fill="#9c96c4">light payloads</text>
      <text x="700" y="196" font-size="11.5" fill="#9c96c4">travel further</text>

      <text x="900" y="158" font-size="14" font-weight="700" fill="#ffffff">Clear signal</text>
      <text x="900" y="180" font-size="11.5" fill="#9c96c4">real talk between</text>
      <text x="900" y="196" font-size="11.5" fill="#9c96c4">design and dev</text>
    </g>
  </g>
</svg>
