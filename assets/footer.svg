<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Thanks for drifting by">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050f"/><stop offset="55%" stop-color="#0a0922"/><stop offset="100%" stop-color="#170e33"/>
    </linearGradient>
    <radialGradient id="nF"><stop offset="0%" stop-color="#7b4dff" stop-opacity="0.32"/><stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c4cf1" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#31d0ff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cfe9ff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thanks" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#e2d8ff"/><stop offset="100%" stop-color="#8fd8ff"/>
    </linearGradient>
    <clipPath id="cardF"><rect width="1000" height="220" rx="20"/></clipPath>
    <style>
      .tw{animation:tw 3.2s ease-in-out infinite}
      .b{animation-delay:.7s}.c{animation-delay:1.4s}.d{animation-delay:2.1s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .glowline{animation:gl 5s ease-in-out infinite}
      @keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
      .up{animation:up 1.1s cubic-bezier(.2,.7,.3,1) both}
      .up2{animation:up 1.1s cubic-bezier(.2,.7,.3,1) .2s both}
      @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#cardF)">
    <rect width="1000" height="220" fill="url(#bgF)"/>
    <ellipse cx="500" cy="200" rx="420" ry="170" fill="url(#nF)"/>
    <rect x="0" y="0" width="1000" height="220" rx="20" fill="none" stroke="#8fd8ff" stroke-opacity=".18"/>

    <g fill="#ffffff">
      <circle class="tw"   cx="70"  cy="40"  r="1.3"/><circle class="tw b" cx="180" cy="88" r="1"/>
      <circle class="tw c" cx="300" cy="34"  r="1.5"/><circle class="tw d" cx="430" cy="72" r="1"/>
      <circle class="tw b" cx="580" cy="30"  r="1.2"/><circle class="tw c" cx="700" cy="80" r="1.1"/>
      <circle class="tw"   cx="830" cy="38"  r="1.4"/><circle class="tw d" cx="930" cy="76" r="1"/>
      <circle class="tw c" cx="120" cy="130" r="1"/>  <circle class="tw b" cx="890" cy="126" r="1.1"/>
    </g>
    <g stroke="#ffffff" stroke-width="1" opacity=".8">
      <path class="tw c" d="M240 130 v-6 M240 130 v6 M240 130 h-6 M240 130 h6"/>
      <path class="tw b" d="M770 128 v-5 M770 128 v5 M770 128 h-5 M770 128 h5"/>
    </g>

    <ellipse cx="500" cy="368" rx="640" ry="172" fill="url(#horizon)"/>
    <path d="M-140 368 a640 172 0 0 1 1280 0" fill="none" stroke="url(#rim)" stroke-width="2" class="glowline"/>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
      <text class="up" x="500" y="112" font-size="30" font-weight="700" fill="url(#thanks)">Thanks for drifting by ✦</text>
      <text class="up2" x="500" y="146" font-size="14" fill="#b7b0d8">Somewhere between the code and the cosmos, there is always a person on the other side of the screen.</text>
      <text class="up2" x="500" y="178" font-size="11" letter-spacing="3.5" fill="#8d86bd">MADE WITH CURIOSITY · BRAZIL · 2026</text>
    </g>
  </g>
</svg>
