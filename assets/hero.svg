<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Michelle Budri Bognar - Software Developer, Human Centered Digital Experiences">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050f"/>
      <stop offset="45%" stop-color="#0b0a26"/>
      <stop offset="100%" stop-color="#1b0f3a"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7b4dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#31d0ff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="60%" stop-color="#efe6d2"/>
      <stop offset="100%" stop-color="#cdbfa6"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffe9a8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dcd2ff"/>
      <stop offset="100%" stop-color="#8fd8ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="280" rx="18"/></clipPath>

    <style>
      .tw { animation: tw 3.2s ease-in-out infinite; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.1s }
      .d4 { animation-delay: 1.6s } .d5 { animation-delay: 2.1s } .d6 { animation-delay: 2.6s }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }

      .float { animation: float 7s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

      .pulse { animation: pulse 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }

      .drift { animation: drift 18s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(28px) } }

      .shoot { animation: shoot 7s ease-in infinite; }
      @keyframes shoot {
        0% { transform: translate(0,0); opacity:0 }
        6% { opacity:1 }
        26% { transform: translate(420px,190px); opacity:0 }
        100% { transform: translate(420px,190px); opacity:0 }
      }
      .shoot2 { animation: shoot 7s ease-in 3.5s infinite; }

      .orbit { transform-origin: 838px 118px; animation: spin 26s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .fade { animation: fade 1.4s ease-out both; }
      .fade2 { animation: fade 1.4s ease-out .35s both; }
      .fade3 { animation: fade 1.4s ease-out .7s both; }
      @keyframes fade { from { opacity:0 } to { opacity:1 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>

    <!-- nebulas -->
    <g class="drift">
      <ellipse cx="180" cy="60" rx="260" ry="150" fill="url(#nebulaA)"/>
      <ellipse cx="560" cy="250" rx="300" ry="140" fill="url(#nebulaB)"/>
      <ellipse cx="900" cy="230" rx="220" ry="130" fill="url(#nebulaC)"/>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="tw"    cx="42"  cy="46"  r="1.5"/>
      <circle class="tw d2" cx="96"  cy="128" r="1.1"/>
      <circle class="tw d4" cx="150" cy="34"  r="1.8"/>
      <circle class="tw d1" cx="212" cy="196" r="1.2"/>
      <circle class="tw d5" cx="268" cy="72"  r="1.5"/>
      <circle class="tw d3" cx="322" cy="150" r="1"/>
      <circle class="tw d6" cx="376" cy="28"  r="1.6"/>
      <circle class="tw d2" cx="646" cy="264" r="1.3"/>
      <circle class="tw d4" cx="486" cy="96"  r="1.1"/>
      <circle class="tw"    cx="540" cy="40"  r="1.7"/>
      <circle class="tw d5" cx="596" cy="178" r="1.2"/>
      <circle class="tw d1" cx="652" cy="62"  r="1.4"/>
      <circle class="tw d3" cx="706" cy="228" r="1.1"/>
      <circle class="tw d6" cx="762" cy="42"  r="1.6"/>
      <circle class="tw d2" cx="818" cy="248" r="1.2"/>
      <circle class="tw d4" cx="884" cy="196" r="1.4"/>
      <circle class="tw d1" cx="938" cy="66"  r="1.1"/>
      <circle class="tw d5" cx="972" cy="150" r="1.6"/>
      <circle class="tw d3" cx="118" cy="236" r="1.3"/>
      <circle class="tw d6" cx="244" cy="118" r="0.9"/>
      <circle class="tw d2" cx="470" cy="256" r="1"/>
      <circle class="tw d4" cx="620" cy="120" r="0.9"/>
      <circle class="tw"    cx="700" cy="152" r="1.2"/>
      <circle class="tw d5" cx="352" cy="86"  r="0.9"/>
    </g>

    <!-- sparkle stars -->
    <g stroke="#ffffff" stroke-width="1" opacity=".85">
      <path class="tw d3" d="M666 58 v-9 M666 58 v9 M666 58 h-9 M666 58 h9"/>
      <path class="tw d5" d="M712 246 v-7 M712 246 v7 M712 246 h-7 M712 246 h7"/>
      <path class="tw d1" d="M962 36 v-7 M962 36 v7 M962 36 h-7 M962 36 h7"/>
    </g>

    <!-- shooting stars -->
    <g class="shoot">
      <rect x="60" y="10" width="70" height="1.6" rx="1" fill="url(#trail)" transform="rotate(24 60 10)"/>
      <circle cx="130" cy="41" r="1.8" fill="#fff"/>
    </g>
    <g class="shoot2" transform="translate(300,-30)">
      <rect x="60" y="10" width="52" height="1.3" rx="1" fill="url(#trail)" transform="rotate(24 60 10)"/>
      <circle cx="112" cy="33" r="1.4" fill="#fff"/>
    </g>

    <!-- moon -->
    <g class="float">
      <circle cx="838" cy="118" r="118" fill="url(#moonGlow)" class="pulse"/>
      <g class="orbit" fill="none" stroke="#9fd9ff" stroke-opacity=".35" stroke-width="1.2">
        <ellipse cx="838" cy="118" rx="96" ry="34"/>
        <circle cx="934" cy="118" r="3.4" fill="#9fd9ff" stroke="none"/>
      </g>
      <circle cx="838" cy="118" r="58" fill="url(#moonBody)"/>
      <g fill="#c3b49a" opacity=".55">
        <circle cx="818" cy="98"  r="11"/>
        <circle cx="854" cy="132" r="8"/>
        <circle cx="826" cy="142" r="5"/>
        <circle cx="861" cy="94"  r="4.5"/>
        <circle cx="800" cy="128" r="3.5"/>
      </g>
      <circle cx="838" cy="118" r="58" fill="none" stroke="#fff6d8" stroke-opacity=".5" stroke-width="1"/>
    </g>

    <!-- text -->
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
      <text class="fade" x="72" y="94" font-size="15" letter-spacing="6" fill="#8fd8ff" opacity=".95">HELLO, UNIVERSE</text>
      <text class="fade2" x="70" y="152" font-size="46" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)">Michelle Budri Bognar</text>
      <text class="fade3" x="72" y="188" font-size="17" fill="#c9c3e8">Software Developer · Human-Centered Digital Experiences</text>
      <text class="fade3" x="72" y="222" font-size="14" letter-spacing="2.5" fill="#7f7aa8">BRAZIL · MBA SOFTWARE ENGINEERING · USP</text>
    </g>
  </g>
</svg>
