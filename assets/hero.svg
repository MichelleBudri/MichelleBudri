<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Michelle Budri Bognar - Software Developer, Human Centered Digital Experiences">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03040d"/>
      <stop offset="42%" stop-color="#0a0922"/>
      <stop offset="100%" stop-color="#1a0f38"/>
    </linearGradient>
    <radialGradient id="nebA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7b4dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#31d0ff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="34%" cy="28%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="55%" stop-color="#eee3cd"/>
      <stop offset="100%" stop-color="#bfae91"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#ffe9a8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#e2d8ff"/>
      <stop offset="100%" stop-color="#7fd2ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8fd8ff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="320" rx="20"/></clipPath>
    <mask id="sweepMask">
      <rect width="1000" height="320" fill="#000"/>
      <rect class="sweepBar" x="-260" y="0" width="260" height="320" fill="url(#sweep)"/>
    </mask>

    <style>
      .tw { animation: tw 3.2s ease-in-out infinite }
      .d1{animation-delay:.3s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}
      .d4{animation-delay:1.6s}.d5{animation-delay:2.1s}.d6{animation-delay:2.6s}
      @keyframes tw { 0%,100%{opacity:.22} 50%{opacity:1} }

      .float { animation: float 8s ease-in-out infinite }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

      .pulse { animation: pulse 5s ease-in-out infinite }
      @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

      .drift { animation: drift 20s ease-in-out infinite alternate }
      @keyframes drift { from{transform:translateX(0)} to{transform:translateX(26px)} }

      .shoot { animation: shoot 8s ease-in infinite }
      .shoot2 { animation: shoot 8s ease-in 4s infinite }
      @keyframes shoot {
        0%{transform:translate(0,0);opacity:0} 5%{opacity:1}
        24%{transform:translate(430px,195px);opacity:0} 100%{transform:translate(430px,195px);opacity:0}
      }

      .ring1 { transform-origin:832px 150px; animation: spin 30s linear infinite }
      .ring2 { transform-origin:832px 150px; animation: spin 46s linear infinite reverse }
      @keyframes spin { to { transform: rotate(360deg) } }

      .draw { stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 3.5s ease-out .4s forwards }
      @keyframes draw { to { stroke-dashoffset: 0 } }

      .sweepBar { animation: sweepMove 6.5s ease-in-out 1.2s infinite }
      @keyframes sweepMove { 0%{transform:translateX(0)} 55%,100%{transform:translateX(1000px)} }

      .up  { animation: up 1.1s cubic-bezier(.2,.7,.3,1) both }
      .up2 { animation: up 1.1s cubic-bezier(.2,.7,.3,1) .18s both }
      .up3 { animation: up 1.1s cubic-bezier(.2,.7,.3,1) .36s both }
      .up4 { animation: up 1.1s cubic-bezier(.2,.7,.3,1) .54s both }
      @keyframes up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

      .blink { animation: blink 2.2s steps(1) infinite }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#sky)"/>

    <g class="drift">
      <ellipse cx="150" cy="40"  rx="280" ry="160" fill="url(#nebA)"/>
      <ellipse cx="540" cy="300" rx="320" ry="150" fill="url(#nebB)"/>
      <ellipse cx="900" cy="270" rx="240" ry="140" fill="url(#nebC)"/>
    </g>

    <!-- perspective grid horizon -->
    <g stroke="url(#gridFade)" stroke-width="1" opacity=".65">
      <path d="M-200 320 L420 246"/><path d="M40 320 L470 246"/><path d="M280 320 L520 246"/>
      <path d="M520 320 L570 246"/><path d="M760 320 L620 246"/><path d="M1000 320 L670 246"/>
      <path d="M1240 320 L720 246"/>
      <path d="M0 250 H1000" opacity=".5"/><path d="M0 262 H1000" opacity=".55"/>
      <path d="M0 280 H1000" opacity=".6"/><path d="M0 304 H1000" opacity=".7"/>
    </g>

    <!-- constellation -->
    <g stroke="#8fd8ff" stroke-opacity=".45" stroke-width="1" fill="none">
      <path class="draw" d="M470 34 L522 66 L580 42 L622 82 L556 96 L522 66"/>
    </g>
    <g fill="#dff1ff">
      <circle class="tw"    cx="470" cy="34" r="2.4"/>
      <circle class="tw d2" cx="522" cy="66" r="2.8"/>
      <circle class="tw d4" cx="580" cy="42" r="2.2"/>
      <circle class="tw d1" cx="622" cy="82" r="2.4"/>
      <circle class="tw d5" cx="556" cy="96" r="2"/>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="tw"    cx="38"  cy="52"  r="1.5"/><circle class="tw d2" cx="92"  cy="140" r="1.1"/>
      <circle class="tw d4" cx="146" cy="30"  r="1.8"/><circle class="tw d1" cx="206" cy="214" r="1.2"/>
      <circle class="tw d5" cx="262" cy="256" r="1.5"/><circle class="tw d3" cx="318" cy="164" r="1"/>
      <circle class="tw d6" cx="372" cy="26"  r="1.6"/><circle class="tw d2" cx="430" cy="118" r="1.1"/>
      <circle class="tw"    cx="486" cy="196" r="1.3"/><circle class="tw d5" cx="536" cy="34"  r="1.7"/>
      <circle class="tw d1" cx="576" cy="196" r="1.2"/><circle class="tw d3" cx="622" cy="220" r="1.1"/>
      <circle class="tw d6" cx="770" cy="34"  r="1.6"/><circle class="tw d2" cx="948" cy="228" r="1.2"/>
      <circle class="tw d4" cx="922" cy="60"  r="1.4"/><circle class="tw d1" cx="978" cy="118" r="1.1"/>
      <circle class="tw d5" cx="112" cy="252" r="1.3"/><circle class="tw d3" cx="238" cy="112" r="0.9"/>
      <circle class="tw d6" cx="352" cy="88"  r="0.9"/><circle class="tw d2" cx="466" cy="62"  r="1"/>
      <circle class="tw d4" cx="700" cy="216" r="1.1"/><circle class="tw"    cx="880" cy="252" r="1.2"/>
    </g>
    <g stroke="#ffffff" stroke-width="1" opacity=".8">
      <path class="tw d3" d="M760 250 v-8 M760 250 v8 M760 250 h-8 M760 250 h8"/>
      <path class="tw d5" d="M966 42 v-7 M966 42 v7 M966 42 h-7 M966 42 h7"/>
      <path class="tw d1" d="M556 258 v-6 M556 258 v6 M556 258 h-6 M556 258 h6"/>
    </g>

    <g class="shoot"><rect x="60" y="8" width="76" height="1.6" rx="1" fill="url(#trail)" transform="rotate(24 60 8)"/><circle cx="136" cy="42" r="1.8" fill="#fff"/></g>
    <g class="shoot2" transform="translate(320,-40)"><rect x="60" y="8" width="54" height="1.3" rx="1" fill="url(#trail)" transform="rotate(24 60 8)"/><circle cx="114" cy="32" r="1.4" fill="#fff"/></g>

    <!-- planet + orbits -->
    <g class="float">
      <circle cx="832" cy="150" r="130" fill="url(#moonGlow)" class="pulse"/>
      <g class="ring1" fill="none" stroke="#9fd9ff" stroke-opacity=".38" stroke-width="1.2">
        <ellipse cx="832" cy="150" rx="112" ry="36"/>
        <circle cx="944" cy="150" r="3.6" fill="#9fd9ff" stroke="none"/>
      </g>
      <g class="ring2" fill="none" stroke="#ff9ec7" stroke-opacity=".30" stroke-width="1">
        <ellipse cx="832" cy="150" rx="92" ry="70" transform="rotate(24 832 150)"/>
        <circle cx="924" cy="150" r="2.6" fill="#ff9ec7" stroke="none" transform="rotate(24 832 150)"/>
      </g>
      <circle cx="832" cy="150" r="62" fill="url(#moonBody)"/>
      <g fill="#c0b096" opacity=".5">
        <circle cx="810" cy="128" r="12"/><circle cx="850" cy="166" r="8.5"/>
        <circle cx="818" cy="176" r="5"/><circle cx="856" cy="122" r="4.5"/>
        <circle cx="792" cy="160" r="3.6"/>
      </g>
      <circle cx="832" cy="150" r="62" fill="none" stroke="#fff6d8" stroke-opacity=".45"/>
    </g>

    <!-- text -->
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
      <g class="up">
        <rect x="70" y="66" width="9" height="9" rx="2" fill="#ff5fa2" class="blink"/>
        <text x="92" y="75" font-size="13" letter-spacing="5.5" fill="#8fd8ff">HELLO, UNIVERSE</text>
      </g>
      <g class="up2">
        <text x="68" y="146" font-size="52" font-weight="700" letter-spacing="0.5" fill="url(#nameGrad)">Michelle Budri Bognar</text>
        <text x="68" y="146" font-size="52" font-weight="700" letter-spacing="0.5" fill="#ffffff" mask="url(#sweepMask)">Michelle Budri Bognar</text>
      </g>
      <text class="up3" x="70" y="180" font-size="17" fill="#cfc8ec">Software Developer · Human-Centered Digital Experiences</text>
      <g class="up4" font-size="12.5" letter-spacing="2" fill="#8f89b8" font-family="SFMono-Regular, Consolas, Menlo, monospace">
        <rect x="70" y="200" width="112" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#8fd8ff" stroke-opacity=".28"/>
        <circle cx="88" cy="213" r="3" fill="#8fd8ff"/>
        <text x="100" y="217" fill="#8fd8ff">BRAZIL</text>
        <rect x="192" y="200" width="248" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#b39bff" stroke-opacity=".28"/>
        <circle cx="210" cy="213" r="3" fill="#c3b0ff"/>
        <text x="222" y="217" fill="#c3b0ff">MBA SOFTWARE ENG · USP</text>
        <rect x="450" y="200" width="188" height="26" rx="13" fill="#ffffff" fill-opacity=".05" stroke="#ff9ec7" stroke-opacity=".28"/>
        <circle cx="468" cy="213" r="3" fill="#ffa9cd"/>
        <text x="480" y="217" fill="#ffa9cd">ALWAYS BUILDING</text>
      </g>
    </g>
  </g>
</svg>
