0 0 0 902 165 Z" fill="#cfc6f2"/></g><circle cx="902" cy="178" r="13" fill="none" stroke="#8fd8ff" stroke-opacity=".25"/></g><g opacity=".62"><circle cx="944" cy="178" r="13" fill="#0c0b1e"/><g transform="translate(1888,0) scale(-1,1)"><path d="M 944 165 A 13 13 0 0 0 944 191 A 9.192 13 0 0 1 944 165 Z" fill="#cfc6f2"/></g><circle cx="944" cy="178" r="13" fill="none" stroke="#8fd8ff" stroke-opacity=".25"/></g>
