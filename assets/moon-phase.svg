      <stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lit" cx="36%" cy="30%">
      <stop offset="0%" stop-color="#fffdf3"/>
      <stop offset="62%" stop-color="#f2e9d5"/>
      <stop offset="100%" stop-color="#cbbb9d"/>
