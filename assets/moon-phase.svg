      <rect x="648" y="118" width="95.8" height="4" rx="2" fill="#ffd97a" fill-opacity=".75"/>
      <circle cx="743.8" cy="120" r="4" fill="#ffd97a"/>
      <circle cx="743.8" cy="120" r="4" fill="#ffd97a" class="ping"/>
