<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8fd8ff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#c3b0ff" stop-opacity=".8"/>
      <stop offset="70%" stop-color="#ff9ec7" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}.b{animation-delay:.9s}.c{animation-delay:1.8s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .run{animation:run 7s linear infinite}
      @keyframes run{0%{transform:translateX(80px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(920px);opacity:0}}
    </style>
  </defs>
  <path d="M40 14 H960" stroke="url(#dl)" stroke-width="1.4"/>
  <g fill="#ffffff">
    <circle class="tw" cx="200" cy="14" r="1.4"/><circle class="tw b" cx="420" cy="14" r="1.1"/>
    <circle class="tw c" cx="620" cy="14" r="1.3"/><circle class="tw b" cx="800" cy="14" r="1"/>
  </g>
  <circle class="run" cx="0" cy="14" r="3" fill="#ffd97a"/>
</svg>
