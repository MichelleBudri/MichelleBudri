<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Tech stack orbiting Saturn: TypeScript, JavaScript, React Native, Kotlin, Laravel, PHP, HTML5, CSS3, Git, Figma, Android, VS Code — with a friendly alien waving and saying follow me">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#04050f"/><stop offset="55%" stop-color="#0a0922"/><stop offset="100%" stop-color="#170e33"/></linearGradient>
    <radialGradient id="nS"><stop offset="0%" stop-color="#7b4dff" stop-opacity="0.32"/><stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="nS2"><stop offset="0%" stop-color="#31d0ff" stop-opacity="0.24"/><stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="saturn" cx="34%" cy="28%"><stop offset="0%" stop-color="#ffe9b8"/><stop offset="45%" stop-color="#f0c27b"/><stop offset="80%" stop-color="#d99a55"/><stop offset="100%" stop-color="#a56b3c"/></radialGradient>
    <radialGradient id="satGlow"><stop offset="0%" stop-color="#ffd97a" stop-opacity=".34"/><stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8fd8ff" stop-opacity=".25"/><stop offset="35%" stop-color="#c3b0ff" stop-opacity=".9"/><stop offset="65%" stop-color="#ffd97a" stop-opacity=".9"/><stop offset="100%" stop-color="#ff9ec7" stop-opacity=".25"/></linearGradient>
    <linearGradient id="alienBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a8f5d8"/><stop offset="60%" stop-color="#5fd8ab"/><stop offset="100%" stop-color="#2fae82"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd6ff"/><stop offset="45%" stop-color="#8f8ee0"/><stop offset="100%" stop-color="#4a3f8f"/>
    </linearGradient>
    <linearGradient id="hullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f2ff"/><stop offset="100%" stop-color="#a7a5e8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bff0ff" stop-opacity=".55"/><stop offset="60%" stop-color="#7ee7c7" stop-opacity=".16"/><stop offset="100%" stop-color="#8fd8ff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee7c7" stop-opacity=".55"/><stop offset="100%" stop-color="#7ee7c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shipGlow"><stop offset="0%" stop-color="#7ee7c7" stop-opacity=".30"/><stop offset="100%" stop-color="#7ee7c7" stop-opacity="0"/></radialGradient>
    <clipPath id="cardS"><rect width="1000" height="420" rx="20"/></clipPath>
    <clipPath id="planetClip"><circle cx="600" cy="200" r="84"/></clipPath>
    <style>
      .tw{animation:tw 3.4s ease-in-out infinite}
      .d0{animation-delay:.1s}.d1{animation-delay:.35s}.d2{animation-delay:.6s}.d3{animation-delay:.85s}.d4{animation-delay:1.1s}.d5{animation-delay:1.35s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .ch{animation:chin .8s cubic-bezier(.2,.7,.3,1) both, bobb 7s ease-in-out infinite}
      @keyframes chin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
      @keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .spin{animation:ringglow 8s ease-in-out infinite}
      @keyframes ringglow{0%,100%{opacity:.78}50%{opacity:1}}
      .breathe{animation:breathe 6s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
      .ship{animation:ship 5s ease-in-out infinite}
      @keyframes ship{0%,100%{transform:translate(0,0) rotate(-1.5deg)}50%{transform:translate(6px,-10px) rotate(1.5deg)}}
      .wave{transform-origin:102px 304px;animation:wave 1.4s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(24deg)}}
      .ant{transform-origin:120px 268px;animation:ant 3s ease-in-out infinite}
      @keyframes ant{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
      .eyeL{transform-origin:109px 282px;animation:blinkeye 4.5s infinite}
      .eyeR{transform-origin:133px 282px;animation:blinkeye 4.5s infinite}
      @keyframes blinkeye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
      .lamp{animation:lamp 1.8s ease-in-out infinite}
      .k1{animation-delay:.15s}.k2{animation-delay:.3s}.k3{animation-delay:.45s}.k4{animation-delay:.6s}
      @keyframes lamp{0%,100%{opacity:.35}50%{opacity:1}}
      .beam{animation:beam 4s ease-in-out infinite}
      @keyframes beam{0%,100%{opacity:.30}50%{opacity:.75}}
      .say{animation:say 5s ease-in-out infinite}
      @keyframes say{0%,10%{opacity:0;transform:translateY(6px)}20%,70%{opacity:1;transform:translateY(0)}84%,100%{opacity:0;transform:translateY(6px)}}
    </style>
  </defs>

  <g clip-path="url(#cardS)">
    <rect width="1000" height="420" fill="url(#bgS)"/>
    <ellipse cx="840" cy="10" rx="330" ry="160" fill="url(#nS)"/>
    <ellipse cx="120" cy="410" rx="320" ry="160" fill="url(#nS2)"/>
    <rect width="1000" height="420" rx="20" fill="none" stroke="#8fd8ff" stroke-opacity=".18"/>

    <g fill="#fff">
      <circle class="tw" cx="60" cy="40" r="1.2"/><circle class="tw d2" cx="300" cy="26" r="1"/>
      <circle class="tw d4" cx="700" cy="30" r="1.3"/><circle class="tw d1" cx="960" cy="118" r="1.1"/>
      <circle class="tw d3" cx="40" cy="176" r="1"/><circle class="tw d5" cx="964" cy="336" r="1.2"/>
      <circle class="tw d2" cx="470" cy="404" r="1"/><circle class="tw d0" cx="176" cy="118" r="1.1"/>
      <circle class="tw d4" cx="880" cy="392" r="1.2"/><circle class="tw d1" cx="330" cy="392" r="1"/>
    </g>

    <circle cx="600" cy="200" r="150" fill="url(#satGlow)" class="breathe"/>
    <g class="spin"><ellipse cx="600" cy="200" rx="330" ry="96" fill="none" stroke="url(#ringGrad)" stroke-opacity=".32" stroke-width="1.2" transform="rotate(-12 600 200)"/><ellipse cx="600" cy="200" rx="360" ry="104" fill="none" stroke="url(#ringGrad)" stroke-opacity=".5" stroke-width="1.6" transform="rotate(-12 600 200)"/><ellipse cx="600" cy="200" rx="392" ry="112" fill="none" stroke="url(#ringGrad)" stroke-opacity=".26" stroke-width="1" transform="rotate(-12 600 200)"/></g>
    <g class="ch d0"><rect x="249.4" y="185.8" width="106.0" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#3178C6" stroke-opacity=".75"/><circle cx="266.4" cy="200.8" r="4" fill="#3178C6"/><text x="278.4" y="205.3" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">TypeScript</text></g><g class="ch d1"><rect x="352.2" y="134.3" width="106.0" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#F7DF1E" stroke-opacity=".75"/><circle cx="369.2" cy="149.3" r="4" fill="#F7DF1E"/><text x="381.2" y="153.8" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">JavaScript</text></g><g class="ch d2"><rect x="481.1" y="91.7" width="121.2" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#61DAFB" stroke-opacity=".75"/><circle cx="498.1" cy="106.7" r="4" fill="#61DAFB"/><text x="510.1" y="111.2" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">React Native</text></g><g class="ch d3"><rect x="650.5" y="65.1" width="75.6" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#A97BFF" stroke-opacity=".75"/><circle cx="667.5" cy="80.1" r="4" fill="#A97BFF"/><text x="679.5" y="84.6" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Kotlin</text></g><g class="ch d4"><rect x="778.0" y="59.3" width="83.2" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#FF5A4E" stroke-opacity=".75"/><circle cx="795.0" cy="74.3" r="4" fill="#FF5A4E"/><text x="807.0" y="78.8" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Laravel</text></g><g class="ch d5"><rect x="886.5" y="75.2" width="52.8" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#8892BF" stroke-opacity=".75"/><circle cx="903.5" cy="90.2" r="4" fill="#8892BF"/><text x="915.5" y="94.7" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">PHP</text></g><g class="ch d0"><rect x="914.0" y="110.2" width="68.0" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#E86A3A" stroke-opacity=".75"/><circle cx="931.0" cy="125.2" r="4" fill="#E86A3A"/><text x="943.0" y="129.7" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">HTML5</text></g>
    <circle cx="600" cy="200" r="84" fill="url(#saturn)"/>
    <g clip-path="url(#planetClip)" opacity=".35">
      <ellipse cx="600" cy="156" rx="88" ry="10" fill="#b97b41"/>
      <ellipse cx="600" cy="184" rx="88" ry="8" fill="#8d5a2c"/>
      <ellipse cx="600" cy="218" rx="88" ry="12" fill="#c98f4e"/>
      <ellipse cx="600" cy="250" rx="88" ry="9" fill="#8d5a2c"/>
      <circle cx="638" cy="224" r="15" fill="#e9b878" opacity=".7"/>
    </g>
    <circle cx="600" cy="200" r="84" fill="none" stroke="#ffe9b8" stroke-opacity=".45"/>
    <g class="spin" opacity=".9"><ellipse cx="600" cy="200" rx="360" ry="104" fill="none" stroke="url(#ringGrad)" stroke-opacity=".55" stroke-width="1.4" transform="rotate(-12 600 200)"/></g>
    <g class="ch d1"><rect x="900.3" y="158.0" width="60.4" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#4FA3E3" stroke-opacity=".75"/><circle cx="917.3" cy="173.0" r="4" fill="#4FA3E3"/><text x="929.3" y="177.5" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">CSS3</text></g><g class="ch d2"><rect x="825.3" y="210.5" width="52.8" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#F0653A" stroke-opacity=".75"/><circle cx="842.3" cy="225.5" r="4" fill="#F0653A"/><text x="854.3" y="230.0" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Git</text></g><g class="ch d3"><rect x="695.4" y="258.6" width="68.0" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#FF7262" stroke-opacity=".75"/><circle cx="712.4" cy="273.6" r="4" fill="#FF7262"/><text x="724.4" y="278.1" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Figma</text></g><g class="ch d4"><rect x="543.1" y="294.0" width="83.2" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#3DDC84" stroke-opacity=".75"/><circle cx="560.1" cy="309.0" r="4" fill="#3DDC84"/><text x="572.1" y="313.5" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Android</text></g><g class="ch d5"><rect x="401.1" y="310.5" width="83.2" height="30" rx="15" fill="#0b0a22" fill-opacity=".92" stroke="#3EA6E8" stroke-opacity=".75"/><circle cx="418.1" cy="325.5" r="4" fill="#3EA6E8"/><text x="430.1" y="330.0" font-size="12.5" letter-spacing="0.6" fill="#e8e4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">VS Code</text></g>

    <g class="ship">
      <g class="say" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
        <rect x="150" y="196" width="116" height="38" rx="16" fill="#0b0a22" fill-opacity=".92" stroke="#7ee7c7" stroke-opacity=".6"/>
        <path d="M168 232 l-10 20 24 -18 z" fill="#0b0a22" fill-opacity=".92" stroke="#7ee7c7" stroke-opacity=".6"/>
        <text x="208" y="221" text-anchor="middle" font-size="15" font-weight="700" fill="#7ee7c7">follow me!</text>
      </g>

      <ellipse cx="120" cy="318" rx="150" ry="86" fill="url(#shipGlow)"/>

      <path class="beam" d="M92 336 L52 402 L188 402 L148 336 Z" fill="url(#beamG)"/>

      <g class="ant">
        <path d="M110 266 q-6 -12 -10 -16" fill="none" stroke="#5fd8ab" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="99" cy="256" r="5.5" fill="#a8f5d8"/>
        <path d="M130 266 q6 -12 10 -16" fill="none" stroke="#5fd8ab" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="141" cy="256" r="5.5" fill="#a8f5d8"/>
      </g>

      <ellipse cx="120" cy="308" rx="24" ry="16" fill="#3fc296"/>
      <g class="wave">
        <path d="M102 304 q-12 -6 -18 -18" fill="none" stroke="#4fcc9e" stroke-width="7" stroke-linecap="round"/>
        <circle cx="82" cy="283" r="7" fill="#a8f5d8"/>
      </g>
      <path d="M138 304 q12 -5 17 -15" fill="none" stroke="#4fcc9e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="158" cy="286" r="6.5" fill="#a8f5d8"/>

      <ellipse cx="120" cy="284" rx="31" ry="29" fill="url(#alienBody)"/>
      <ellipse cx="110" cy="272" rx="12" ry="7" fill="#ffffff" opacity=".22" transform="rotate(-18 110 272)"/>
      <g class="eyeL">
        <ellipse cx="109" cy="284" rx="7.5" ry="9.5" fill="#141230" transform="rotate(-12 109 284)"/>
        <circle cx="106.5" cy="280" r="2.8" fill="#ffffff"/><circle cx="111" cy="287" r="1.4" fill="#ffffff" opacity=".8"/>
      </g>
      <g class="eyeR">
        <ellipse cx="133" cy="284" rx="7.5" ry="9.5" fill="#141230" transform="rotate(12 133 284)"/>
        <circle cx="130.5" cy="280" r="2.8" fill="#ffffff"/><circle cx="135" cy="287" r="1.4" fill="#ffffff" opacity=".8"/>
      </g>
      <circle cx="97" cy="296" r="4.6" fill="#ff9ec7" opacity=".45"/>
      <circle cx="145" cy="296" r="4.6" fill="#ff9ec7" opacity=".45"/>
      <path d="M114 297 q7 7 14 0" fill="none" stroke="#1d3f34" stroke-width="2.6" stroke-linecap="round"/>

      <path d="M50 318 A 70 70 0 0 1 190 318 Z" fill="url(#glass)" stroke="#bff0ff" stroke-opacity=".55" stroke-width="1.6"/>
      <path d="M72 302 a56 56 0 0 1 30 -34" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

      <ellipse cx="120" cy="322" rx="96" ry="20" fill="url(#hull)"/>
      <ellipse cx="120" cy="316" rx="78" ry="14" fill="url(#hullTop)" opacity=".85"/>
      <ellipse cx="120" cy="322" rx="96" ry="20" fill="none" stroke="#e6e9ff" stroke-opacity=".45"/>
      <path d="M32 326 q88 26 176 0" fill="none" stroke="#2b2560" stroke-opacity=".55" stroke-width="3"/>

      <circle class="lamp"    cx="58"  cy="330" r="4.6" fill="#ffd97a"/>
      <circle class="lamp k1" cx="89"  cy="336" r="4.6" fill="#ff9ec7"/>
      <circle class="lamp k2" cx="120" cy="338" r="4.6" fill="#8fd8ff"/>
      <circle class="lamp k3" cx="151" cy="336" r="4.6" fill="#c3b0ff"/>
      <circle class="lamp k4" cx="182" cy="330" r="4.6" fill="#7ee7c7"/>
    </g>
  </g>
</svg>
