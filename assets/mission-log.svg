<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="Mission log terminal: Michelle Budri Bognar, software developer in Brazil, building software that feels made for people">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050f"/><stop offset="55%" stop-color="#0a0922"/><stop offset="100%" stop-color="#170e33"/>
    </linearGradient>
    <radialGradient id="nM"><stop offset="0%" stop-color="#7b4dff" stop-opacity="0.30"/><stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="nM2"><stop offset="0%" stop-color="#31d0ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#31d0ff" stop-opacity="0"/></radialGradient>
    <clipPath id="cardM"><rect width="1000" height="268" rx="20"/></clipPath>
    <style>
      .tw{animation:tw 3.4s ease-in-out infinite}.b{animation-delay:1s}.c{animation-delay:2s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .l1{animation:in .5s ease-out .2s both}.l2{animation:in .5s ease-out .7s both}
      .l3{animation:in .5s ease-out 1.2s both}.l4{animation:in .5s ease-out 1.7s both}
      .l5{animation:in .5s ease-out 2.2s both}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      .cur{animation:blink 1.1s steps(1) 2.6s infinite both}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .dot{animation:pulse 3s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#cardM)">
    <rect width="1000" height="268" fill="url(#bgM)"/>
    <ellipse cx="900" cy="20" rx="300" ry="150" fill="url(#nM)"/>
    <ellipse cx="80" cy="260" rx="280" ry="140" fill="url(#nM2)"/>
    <rect x="0" y="0" width="1000" height="268" rx="20" fill="none" stroke="#8fd8ff" stroke-opacity=".18"/>
    <g fill="#fff">
      <circle class="tw" cx="700" cy="30" r="1.1"/><circle class="tw b" cx="860" cy="60" r="1"/>
      <circle class="tw c" cx="950" cy="200" r="1.2"/><circle class="tw b" cx="60" cy="240" r="1"/>
    </g>

    <path d="M0 0 h1000 v44 h-1000 z" fill="#ffffff" fill-opacity=".04"/>
    <path d="M0 44 h1000" stroke="#8fd8ff" stroke-opacity=".18"/>
    <g>
      <circle cx="32" cy="22" r="5.5" fill="#ff5f57"/><circle cx="52" cy="22" r="5.5" fill="#febc2e"/><circle cx="72" cy="22" r="5.5" fill="#28c840"/>
      <text x="500" y="27" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#8f89b8" font-family="SFMono-Regular, Consolas, Menlo, monospace">mission-log — michelle@orbit</text>
    </g>

    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14.5">
      <g class="l1">
        <text x="36" y="84" fill="#7ee7c7">$</text><text x="58" y="84" fill="#8fd8ff">whoami</text>
        <text x="36" y="106" fill="#4f4b70">›</text><text x="58" y="106" fill="#ffffff">Michelle Budri Bognar · Software Developer</text>
      </g>
      <g class="l2">
        <text x="36" y="136" fill="#7ee7c7">$</text><text x="58" y="136" fill="#8fd8ff">locate --home</text>
        <text x="36" y="158" fill="#4f4b70">›</text><text x="58" y="158" fill="#c9c3e8">Brazil · Earth · Milky Way <tspan fill="#4f4b70">// MBA Software Engineering, USP</tspan></text>
      </g>
      <g class="l3">
        <text x="36" y="188" fill="#7ee7c7">$</text><text x="58" y="188" fill="#8fd8ff">cat mission.txt</text>
        <text x="36" y="210" fill="#4f4b70">›</text><text x="58" y="210" fill="#c9c3e8">building software that feels made for people</text>
      </g>
      <g class="l4">
        <text x="36" y="240" fill="#7ee7c7">$</text><text x="58" y="240" fill="#8fd8ff">status</text>
        <circle cx="182" cy="235" r="4.5" fill="#7ee7c7" class="dot"/>
        <text x="196" y="240" fill="#ffffff">online — exploring new orbits</text>
        <rect class="cur" x="440" y="228" width="9" height="16" fill="#8fd8ff"/>
      </g>
    </g>
  </g>
</svg>
