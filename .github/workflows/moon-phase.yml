name: 🌙 Update moon phase

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC (~06:17 in Brazil)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate moon phase SVG
        run: python3 scripts/moon_phase.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moon-phase.svg
          git diff --staged --quiet || git commit -m "🌙 moon phase update"
          git push
