name: 🌙 Update orbit (mission control)

on:
  schedule:
    - cron: "17 9 * * *"   # daily at 09:17 UTC (~06:17 in Brazil)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  orbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw mission control (moon phase + GitHub activity)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/mission_control.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mission-control.svg
          git diff --staged --quiet || git commit -m "🌙 orbit update"
          git push
